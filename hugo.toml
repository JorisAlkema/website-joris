baseURL = 'https://jorisalkema.nl/'
title = "ᕕ( ᐛ )ᕗ Joris's website"
theme = 'hugo-bearcub'
copyright = '© [Joris Duurt Cornelis Alkema]'

enableRobotsTXT = true
defaultContentLanguage = 'nl'
disableKinds = ['rss']

[languages.nl]
  languageName = "NL 🇳🇱"
  languageCode = "nl-nl"
  contentDir = "content"
  weight = 1

  # Dutch Menu (Translated!)
  [[languages.nl.menu.main]]
    identifier = "home"
    name = "Thuis"
    url = "/"
    weight = 10
  [[languages.nl.menu.main]]
    identifier = "resume"
    name = "CV"
    url = "/resume.pdf"
    weight = 30
  [[languages.nl.menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 40
  [[languages.nl.menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 50

[languages.en]
  languageName = "en-UK 🇬🇧"
  languageCode = "en-gb"
  contentDir = "content.en"
  weight = 2

  # English Menu
  [[languages.en.menu.main]]
    identifier = "home"
    name = "Home"
    url = "/"
    weight = 10
  [[languages.en.menu.main]]
    identifier = "resume"
    name = "CV"
    url = "/resume.pdf"
    weight = 30
  [[languages.en.menu.main]]
    identifier = "blog"
    name = "Blog"
    url = "/blog/"
    weight = 40
  [[languages.en.menu.main]]
    identifier = "tags"
    name = "Tags"
    url = "/tags/"
    weight = 50

# BearBlog specific settings
[params]
  description = "Joris Alkema — cloud, platform and MLOps engineering, network science research, and personal writing."
